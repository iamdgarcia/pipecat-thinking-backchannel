[project]
name = "pipecat-thinking-backchannel"
version = "0.1.0"
description = "Make agentic voice AI feel alive — Pipecat agents that say \"one sec\" and \"let me check\" while the bot is thinking or running tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Garcia Peña", email = "info@iamdgarcia.com" }]
keywords = [
    "pipecat",
    "voice-ai",
    "backchannel",
    "agentic",
    "conversational-ai",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# The clip infrastructure (library, recorder, player, cache, prewarm) is
# reused from pipecat-backchannel; this package only adds the gate that
# watches the LLM/tool frames. No VAD, no turn model, no ONNX — the gate is
# a pure frame state machine.
dependencies = [
    "pipecat-ai>=1.6.0,<2",
    "pipecat-backchannel>=0.3,<0.4",
]

[project.urls]
Homepage = "https://github.com/iamdgarcia/pipecat-thinking-backchannel"
Repository = "https://github.com/iamdgarcia/pipecat-thinking-backchannel"
Issues = "https://github.com/iamdgarcia/pipecat-thinking-backchannel/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
# Only the examples/ bot needs provider extras — the library itself needs none.
examples = [
    "pipecat-ai[cartesia,cerebras,deepgram,runner,silero,webrtc]",
    "python-dotenv",
]

[tool.uv]
default-groups = ["dev", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_thinking_backchannel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pipecat.*",
    "ignore::DeprecationWarning:pipecat_backchannel.*",
    "ignore:`AudioContextTTSService` is deprecated:DeprecationWarning",
    "ignore:`StartFrame.audio_out_sample_rate` is deprecated:DeprecationWarning",
]
