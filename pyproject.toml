[project]
name = "pipecat-thinking-backchannel"
version = "0.2.0"
description = "Make agentic voice AI feel alive — a Pipecat signal processor that fires when the bot has gone quiet thinking or running tools, so the app can speak a filler."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Garcia Peña", email = "info@iamdgarcia.com" }]
keywords = [
    "pipecat",
    "voice-ai",
    "backchannel",
    "agentic",
    "conversational-ai",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Signal only: the frame state machine that watches the reply and the bot's
# mouth. No clips, no recorder, no player, no VAD, no turn model, no ONNX.
# The action (what to say) belongs to the app; speak.py ships the default.
dependencies = [
    "pipecat-ai>=1.6.0,<2",
]

[project.urls]
Homepage = "https://github.com/iamdgarcia/pipecat-thinking-backchannel"
Repository = "https://github.com/iamdgarcia/pipecat-thinking-backchannel"
Issues = "https://github.com/iamdgarcia/pipecat-thinking-backchannel/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
# Only the examples/ bot needs provider extras — the library itself needs none.
examples = [
    "pipecat-ai[cerebras,deepgram,runner,silero,webrtc]",
    "python-dotenv",
]

[tool.uv]
default-groups = ["dev", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_thinking_backchannel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pipecat.*",
]
